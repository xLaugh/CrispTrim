# Pousser un tag « vX.Y.Z » crée la release GitHub et y joint CrispTrim.exe (version Rust).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du code
        shell: bash
        run: |
          # Même règle que le lanceur (TAG_RE) : vX.Y ou vX.Y.Z, sans suffixe.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME invalide : attendu vX.Y.Z"
            exit 1
          fi
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à version = $version (Cargo.toml)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test --locked

      - name: Construire CrispTrim.exe
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/crisptrim.exe dist/CrispTrim.exe

      - name: Créer la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=""
          if [ -f "docs/release-$GITHUB_REF_NAME.md" ]; then notes="--notes-file docs/release-$GITHUB_REF_NAME.md"; else notes="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" dist/CrispTrim.exe --title "CrispTrim $GITHUB_REF_NAME" $notes --verify-tag

  # Module carte graphique (crisptrim-gpu.exe) : le même programme compilé avec CUDA. CrispTrim.exe le
  # télécharge depuis la release sur les PC NVIDIA. PTX pour sm_80 : RTX 30 et suivantes (compilé à la volée).
  gpu-module:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Installer CUDA 12.9 (compilateur et bibliothèques utiles seulement)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "curand", "curand_dev", "nvrtc", "nvrtc_dev"]'
      - name: Construire crisptrim-gpu.exe
        shell: bash
        env:
          CUDA_COMPUTE_CAP: "80"
        run: |
          cargo build --release --locked --features cuda
          mkdir -p dist
          cp target/release/crisptrim.exe dist/crisptrim-gpu.exe
      - name: Joindre le module à la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/crisptrim-gpu.exe --clobber
