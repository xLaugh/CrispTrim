# Pousser un tag « vX.Y.Z » crée la release GitHub et y joint CrispTrim.exe (version Rust).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version du code
        shell: bash
        run: |
          # Même règle que le lanceur (TAG_RE) : vX.Y ou vX.Y.Z, sans suffixe.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME invalide : attendu vX.Y.Z"
            exit 1
          fi
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à version = $version (Cargo.toml)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Tests
        run: cargo test --locked

      - name: Construire CrispTrim.exe
        shell: bash
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/crisptrim.exe dist/CrispTrim.exe

      - name: Créer la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=""
          if [ -f "docs/release-$GITHUB_REF_NAME.md" ]; then notes="--notes-file docs/release-$GITHUB_REF_NAME.md"; else notes="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" dist/CrispTrim.exe --title "CrispTrim $GITHUB_REF_NAME" $notes --verify-tag
