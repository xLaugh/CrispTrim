[package]
name = "crisptrim"
version = "0.2.0"
edition = "2021"
authors = ["xLaugh"]
description = "Coupe automatiquement les silences et les hésitations (« euh ») des rushes."
license = "GPL-3.0-only"
build = "build.rs"
repository = "https://github.com/xLaugh/CrispTrim"

[[bin]]
name = "crisptrim"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha1_smol = "1"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
