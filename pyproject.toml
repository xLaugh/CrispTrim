[project]
name = "crisptrim"
dynamic = ["version"]
description = "Coupe automatiquement les silences et les hésitations (« euh ») des rushes, avec CrisperWhisper."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "xLaugh" }]
keywords = ["video", "montage", "silence", "whisper", "davinci-resolve", "premiere", "vegas"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5",
]

[project.urls]
Homepage = "https://github.com/xLaugh/CrispTrim"
Issues = "https://github.com/xLaugh/CrispTrim/issues"
Releases = "https://github.com/xLaugh/CrispTrim/releases"

[project.optional-dependencies]
# Transcription mot à mot (nécessaire pour détecter les « euh »).
asr = ["crisperwhisper[transformers]>=2.0.3", "torch>=2.7"]

[project.scripts]
crisptrim = "crisptrim.cli:main"
crisptrim-app = "crisptrim.app.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# La version est écrite à un seul endroit : crisptrim/__init__.py
[tool.hatch.version]
path = "crisptrim/__init__.py"

# PyTorch CUDA 12.8 : obligatoire pour les cartes RTX 50xx (Blackwell).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
